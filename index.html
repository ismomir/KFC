<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KFC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="hero">

            <!-- Шапка -->
            <div class="header">
                
                    <img src="kfc.png" alt="KFC" class="logo-img">
             

                <div class="nav">
                    <p>ABOUT US</p>
                    <p>FIND US</p>
                    <p>ALL CAMPAIGNS</p>

                        <img src="akun.png" alt="Account">
                    
                    
                        <img src="basket.png" alt="Basket">
                
                </div>
            </div>

            <!-- Основной блок -->
            <div class="hero-content">
                <div class="left">
                    <p>JAGONYA AYAM<br>BUCKET MENU<br>CAMPAIGN</p>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Urna id ut velit convallis nec sit felis. Non non sagittis aenean enim tellus erat semper. Enim a eros urna aliquam, tempor, tortor.</p>

                    <p href="#" class="btn-order">ORDER NOW</p>

                    <div class="dots">
                        <span class="dot"></span>
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>

                <div class="right">
                    <img src="image 4.png" alt="Chicken" class="chicken">
                    <img src="image 2.png" alt="Bucket" class="bucket">
                    <img src="image 3.png" alt="Fries" class="fries">
                    <img src="Group 3.png" alt="Price" class="price">
                </div>
            </div>

        </div>

</html>
